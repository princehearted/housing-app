<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habitra | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: #ffffff; color: #000000; min-height: 100vh; }
    body.dark { background: #000000; color: #ffffff; }
    body.dark a, body.dark h1, body.dark h2, body.dark h3, body.dark h4, body.dark p, body.dark span, body.dark label { color: #ffffff !important; }
    body.dark input { background: #1a1a1a !important; color: #ffffff !important; border-color: #333 !important; }
    body.dark header { background: #111; border-color: #333; }
    body.dark .login-card { background: #111; border-color: #333; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #0ea5a4, #14b8a6); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 18px; height: 18px; color: white; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 1.3rem; font-weight: 700; }

    .nav-btns { display: flex; gap: 10px; align-items: center; }
    .nav-btn { padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
    .nav-btn.light { background: #f1f5f9; color: #000; }
    body.dark .nav-btn.light { background: #222; color: #fff; }
    .nav-btn.accent { background: #0ea5a4; color: white; }

    .login-wrap { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 65px); padding: 20px; }
    .login-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; width: 100%; max-width: 380px; }
    .login-card h2 { font-family: 'Sora', sans-serif; margin-bottom: 6px; }
    .login-card .sub { color: #555; margin-bottom: 24px; font-size: 0.9rem; }
    body.dark .login-card .sub { color: #aaa; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
    .pass-group { position: relative; }
    .pass-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; background: none; border: none; padding: 4px; display: flex; align-items: center; }
    body.dark .pass-toggle { color: #aaa; }

    .form-btn { width: 100%; padding: 14px; background: #0ea5a4; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .form-btn:disabled { opacity: 0.6; }

    .form-status { text-align: center; margin-top: 14px; font-size: 0.85rem; }
    .form-status.error { color: #ef4444; }
    .form-status.success { color: #22c55e; }

    .login-foot { text-align: center; margin-top: 20px; font-size: 0.9rem; }
    .login-foot a { color: #0ea5a4; font-weight: 500; }

    .theme-btn { background: none; border: none; cursor: pointer; padding: 8px; }
    .theme-btn svg { width: 22px; height: 22px; stroke: #000; }
    body.dark .theme-btn svg { stroke: #fff; }
  </style>
</head>
<body>
  <header>
    <a href="services.html" class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
      <span>Habitra</span>
    </a>
    <div class="nav-btns">
      <button class="theme-btn" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/></svg>
      </button>
      <a href="services.html" class="nav-btn light">Home</a>
      <a href="register.html" class="nav-btn accent">Get Started</a>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="sub">Sign in to your account</p>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="login-email" placeholder="you@example.com" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="pass-group">
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="form-btn" id="login-submit">Sign In</button>
        <p class="form-status" id="login-status"></p>
      </form>

      <p class="login-foot">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    // Auto-redirect if already logged in
    const existingUser = API.getUser();
    if (existingUser && API.getToken()) {
      API.redirectByRole(existingUser);
    }

    const emailInput = document.getElementById('login-email');
    emailInput.addEventListener('input', function() {
      if (this.value.includes('"')) {
        this.value = this.value.replace(/"/g, '@');
      }
      if (this.value.includes("'")) {
        this.value = this.value.replace(/'/g, '');
      }
    });

    const passInput = document.getElementById('login-password');
    const passToggle = document.getElementById('pass-toggle');
    const eyeIcon = document.getElementById('eye-icon');

    passToggle.addEventListener('click', () => {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
      
      // Update eye icon
      if (type === 'text') {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('login-status');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Signing in...';
      statusEl.className = 'form-status';
      submitBtn.disabled = true;

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const data = await API.auth.login(email, password);
        
        statusEl.textContent = 'Success!';
        statusEl.className = 'form-status success';

        setTimeout(() => {
          API.redirectByRole(data.user);
        }, 500);
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'form-status error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
